about:
  title: Warum eigentlich Etage?
  body: |-
    Angefangen hat alles unterm Dach: Nathan gab seine ersten Trommelstunden in einem Dachgeschoss in seiner Heimatstadt. Daher der Name.

    In Berlin zog die Beat-Etage in ein altes Backsteinhaus in der Bouchéstraße, eine ehemalige Mädchenschule mit sehr hohen Decken und einem Treppenhaus, das nach Stein riecht. Das Haus wird jetzt von Grund auf saniert. Deshalb ist die Beat-Etage in die Halle 19 umgezogen.

    Nathan trommelt seit 1999 und unterrichtet seit 2003. Als Jugendlicher war er in der Hip-Hop-Szene seiner Heimatstadt Minden unterwegs: Beatboxen, Breakdance, Graffiti. Ein erster Trommel-Workshop wurde zum Startschuss für ein Leben mit Djembe und Dunduns, mit vielen Workshops bei der Familie Konaté und Reisen nach Guinea.

    Als Psychologe und Coach interessiert ihn besonders, was entsteht, wenn eine Gruppe gemeinsam Rhythmus macht, und unter welchen Bedingungen Menschen am besten lernen. Sein Unterricht ist klar strukturiert und didaktisch durchdacht.
  imageAlt: Nathan Berg mit einer Djembe auf der Schulter
  link:
    label: Mehr zum Team
    href: /team
  image: ../../assets/media/de/home/about/image.jpg
visit:
  title: Besuch uns in Halle 19
