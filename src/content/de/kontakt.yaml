intro: Schreib uns oder ruf an. Für Buchungsanfragen schick uns am besten die Eckdaten per E-Mail.
directions: |-
  ## So findest du uns

  Bouchéstraße 12, Halle 19, Eingang B
  12435 Berlin

  Gib bei Google Maps am besten „Percussionstudio Beat-Etage“ ein. Anfahrt und Eingang am besten über die Jordanstraße, dort kannst du auch gut parken.
roomTitle: Der Raum
roomText: "Unser neuer Raum in Halle 19 ist anders als der alte. Gleich geblieben ist, was uns wichtig ist: warme Akustik, viel Holz und Trommeln, so weit das Auge reicht."
imageAlt: "Der Raum in Halle 19: gelbes Sofa, Pflanzen, große Fenster und Dunduns auf dem Teppich"
imageCaption: Unser Raum in Halle 19.
