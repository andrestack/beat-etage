title: Datenschutzerklärung
body: |-
  ## Auf einen Blick

  Diese Website setzt keine Cookies, verwendet keine Analyse- oder Tracking-Dienste und bindet keine externen Inhalte wie Karten, Videos oder Schriftarten von Drittanbietern ein. Die Schriftart wird von unserem eigenen Server ausgeliefert.

  ## Verantwortlicher

  Nathan Lennart Berg, Heidelberger Str. 44 F, 12059 Berlin
  E-Mail: kontakt@beat-etage.de, Telefon: 0163 5324200

  ## Hosting

  Diese Website wird bei Vercel Inc., 440 N Barranca Ave #4133, Covina, CA 91723, USA gehostet. Beim Aufruf der Seite verarbeitet der Hoster technisch notwendige Daten (IP-Adresse, Datum und Uhrzeit, aufgerufene Seite, Browsertyp) in Server-Logfiles, um die Seite auszuliefern und abzusichern. Rechtsgrundlage ist unser berechtigtes Interesse an einem sicheren und stabilen Betrieb (Art. 6 Abs. 1 lit. f DSGVO). Mit Vercel besteht ein Vertrag zur Auftragsverarbeitung; die Datenübermittlung in die USA stützt sich auf den EU-US Data Privacy Framework bzw. Standardvertragsklauseln.

  ## Kontaktaufnahme

  Wenn du uns per E-Mail oder Telefon kontaktierst, verarbeiten wir deine Angaben zur Bearbeitung deiner Anfrage (Art. 6 Abs. 1 lit. b oder f DSGVO). Wir geben sie nicht weiter und löschen sie, sobald sie nicht mehr erforderlich sind.

  ## Buchungen und externe Links

  Termine werden über Eversports gebucht, weitere Links führen zu Urban Sports Club, Facebook, YouTube, Instagram und Telegram. Mit dem Klick auf einen solchen Link verlässt du unsere Website; für die dortige Datenverarbeitung sind die jeweiligen Anbieter verantwortlich.

  ## Deine Rechte

  Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch (Art. 15 bis 21 DSGVO). Du kannst dich außerdem bei einer Datenschutzaufsichtsbehörde beschweren, in Berlin bei der Berliner Beauftragten für Datenschutz und Informationsfreiheit.
