body: |-
  ## So läuft eine Session

  Nach einer kurzen Vorstellung aller Instrumente spielen wir gemeinsam einen einfachen Rhythmus. Dann folgen kleine Rhythmusspiele. Nach wenigen Minuten wird rasselnd der Dancefloor eröffnet, mit einfachen Gesängen und einer Mini-Choreographie.

  ## Warum es funktioniert

  Kinder lernen am einfachsten durch Beobachten und Nachahmen. Wenn die Eltern sichtlich Spaß haben und mitmachen, schauen sich die Kinder das ab. Manche beobachten bei den ersten Terminen erst einmal, und das ist völlig in Ordnung.

  ## Noch mehr für Kinder

  Auf Anfrage gibt es interaktive Events für Kinderfeste und Workshop-Projekte für Schulen und Kitas. Schreib uns dazu eine E-Mail mit den Eckdaten.

  ## Immer auf dem Laufenden

  Den nächsten Termin erfährst du über unseren E-Mail-Verteiler oder den Telegram-Kanal: https://t.me/+eZi6Ol6LdBs4YTUy
