body: |-
  ## Was wir machen

  Wir verwenden nur hochwertige Materialien. Felle gibt es in verschiedenen Mustern und Stärken, je nach Geschmack. Zur Generalüberholung gehören bei Bedarf eine Abrundung der Spielkante und eine frische Ölung des Holzkorpus.

  Der Preis hängt davon ab, was am Instrument gemacht werden muss. Schick uns am besten ein Foto und eine kurze Beschreibung.
