body: |-
  ## Warum Trommeln im Team?

  Beim Trommeln spielt jede Person oder Kleingruppe einen einfachen Basisrhythmus, und erst im Zusammenspiel entsteht der volle Klang. Dabei geht es um aufeinander hören, zur richtigen Zeit seinen Teil beitragen und den Rhythmus der Gruppe spüren. Nathan Berg, Psychologe, Coach und Rhythmustrainer, macht diese Grundpfeiler der Zusammenarbeit trommelnd und mit viel Spaß erlebbar.

  ## Die Trommeln kommen mit

  Meist reisen die Instrumente per Lastenrad. Wird die Ladung größer, springt Roberta ein, der beige-gelbe VW-Bus der Beat-Etage.

  Anfragen schickst du uns am besten per E-Mail mit den Eckdaten.
