body: |-
  ## Der Raum

  Akustikschaumstoff an den Wänden, viel Holz, Tageslicht und Regale voller Trommeln: Der Raum ist für laute Musik gemacht und trotzdem gemütlich.

  Mehr zu Größe, Ausstattung und Mietpreisen folgt in Kürze. Bis dahin schreib uns einfach.
