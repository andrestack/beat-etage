body: |-
  ## How a session goes

  After a short introduction to all the instruments we play a simple rhythm together. Then come small rhythm games. After a few minutes the dance floor opens with shakers, simple songs and a mini choreography.

  ## Why it works

  Children learn most easily by watching and imitating. When parents visibly have fun and join in, the kids pick it up. Some children just watch at the first sessions, and that is perfectly fine.

  ## More for kids

  On request we offer interactive events for kids’ parties and workshop projects for schools and nurseries. Send us an email with the key details.

  ## Stay in the loop

  You can hear about the next date through our email list or the Telegram channel: https://t.me/+eZi6Ol6LdBs4YTUy
