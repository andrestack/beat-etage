imageAlt: Close-up of a djembe skin at the playing edge
classes:
  - name: Re-skinning and repair
    when: by arrangement
    price: price by effort
    note: "After a torn skin a full overhaul often makes sense: new skin, new ropes and rings."
body: |-
  ## What we do

  We only use high-quality materials. Skins come in different patterns and thicknesses, to taste. An overhaul includes, where needed, rounding the playing edge and a fresh oiling of the wooden body.

  The price depends on what has to be done to the instrument. The best way to start is a photo and a short description.
