body: |-
  ## Why drum as a team?

  In drumming every person or small group plays a simple base rhythm, and the full sound only appears when they play together. It is about listening to each other, contributing at the right time and feeling the rhythm of the group. Nathan Berg, psychologist, coach and rhythm trainer, makes these pillars of cooperation tangible through drumming and a lot of fun.

  ## The drums travel with us

  Usually the instruments travel by cargo bike. When the load gets bigger, Roberta steps in, the beige-and-yellow VW camper of the Beat-Etage.

  The best way to ask is an email with the key details.
