title: Contact & directions
intro: Write or call. For booking requests, an email with the key details works best.
directions: |-
  ## How to find us

  Bouchéstraße 12, Halle 19, Entrance B
  12435 Berlin

  On Google Maps, search for “Percussionstudio Beat-Etage”. The best way in is via Jordanstraße, where you can also park easily.
roomTitle: The room
roomText: "Our new room in Halle 19 is different from the old one, and photos will follow soon. What matters to us stays the same: warm acoustics, lots of wood and drums as far as the eye can see."
imageAlt: "The old class room at Bouchéstraße 75: drums in a circle, foam on the walls, tall windows"
imageCaption: "Our old room at Bouchéstraße 75: a classroom in a brick building."
