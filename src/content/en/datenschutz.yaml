title: Privacy policy
body: |-
  ## At a glance

  This website sets no cookies, uses no analytics or tracking services and embeds no external content such as maps, videos or third-party fonts. The typeface is served from our own server.

  ## Controller

  Nathan Lennart Berg, Heidelberger Str. 44 F, 12059 Berlin, Germany
  Email: kontakt@beat-etage.de, phone: 0163 5324200

  ## Hosting

  This website is hosted by Vercel Inc., 440 N Barranca Ave #4133, Covina, CA 91723, USA. When you visit the site, the host processes technically necessary data (IP address, date and time, requested page, browser type) in server log files in order to deliver and secure the site. The legal basis is our legitimate interest in secure and stable operation (Art. 6(1)(f) GDPR). A data processing agreement is in place with Vercel; transfers to the USA rely on the EU-US Data Privacy Framework or standard contractual clauses.

  ## Contacting us

  If you contact us by email or phone, we process your details to handle your request (Art. 6(1)(b) or (f) GDPR). We do not pass them on and delete them once they are no longer needed.

  ## Bookings and external links

  Dates are booked through Eversports, and further links lead to Urban Sports Club, Facebook, YouTube, Instagram and Telegram. When you click such a link you leave our website; the respective providers are responsible for the data processing there.

  ## Your rights

  You have the right to access, rectification, erasure, restriction of processing, data portability and objection (Art. 15 to 21 GDPR). You can also complain to a data protection authority; in Berlin, that is the Berliner Beauftragte für Datenschutz und Informationsfreiheit.
