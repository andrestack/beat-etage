about:
  title: Why “Etage”?
  body: |-
    It all began under the roof: Nathan gave his first drum lessons in an attic in his hometown. Hence the name (Etage means floor).

    In Berlin the Beat-Etage moved into an old brick building on Bouchéstraße, a former girls’ school with very high ceilings and a stairwell that smells of stone. The building is now being fully renovated, so the Beat-Etage moved to Halle 19.

    Nathan has been drumming since 1999 and teaching since 2003. As a teenager he was part of the hip hop scene in his hometown Minden: beatboxing, breakdance, graffiti. A first drum workshop became the start of a life with djembe and dunduns, with many workshops with the Konaté family and trips to Guinea.

    As a psychologist and coach he is especially interested in what happens when a group makes rhythm together, and in the conditions under which people learn best. His teaching is clearly structured and didactically thought through.
  imageAlt: Nathan Berg with a djembe on his shoulder
  link:
    label: More about the team
    href: /team
  image: ../../assets/media/en/home/about/image.jpg
